# Release pipeline
#
# Triggered when a version tag (e.g. v0.6.1) is pushed.
#
# Jobs
# ────
# test     – lint (ruff) + pytest across Python 3.11 / 3.12 / 3.13
# build    – produce wheel + sdist and upload as a workflow artifact
# pypi     – publish to PyPI via OIDC trusted publishing (no secrets required;
#             one-time PyPI setup: add a "GitHub Actions" trusted publisher for
#             this repo under the "release" environment)
# release  – create a GitHub Release and attach the wheel + sdist
#
# PyPI setup (one-time)
# ─────────────────────
# 1. Go to https://pypi.org/manage/project/llmstack/settings/publishing/
# 2. Add a new "pending publisher" (or edit the existing publisher):
#    - Owner:       rohitgarg19
#    - Repository:  llmstack
#    - Workflow:    release.yml
#    - Environment: release
# After that, no PYPI_API_TOKEN secret is needed.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. Tests
  # ──────────────────────────────────────────────
  test:
    name: "Test – Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest llmstack/tests/ -v

  # ──────────────────────────────────────────────
  # 2. Build wheel + sdist
  # ──────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 3. Publish to PyPI (OIDC trusted publishing)
  # ──────────────────────────────────────────────
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: release
      url: https://pypi.org/project/llmstack/
    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ──────────────────────────────────────────────
  # 4. GitHub Release with downloadable assets
  # ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # required to create a release and upload assets

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "llmstack ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
