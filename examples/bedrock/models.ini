; ----------------------------------------------------------------------------
; models.ini  -  inventory of models served by opencode-llmstack.
;
; Runtime config: .llmstack/llama-swap.yaml  (written by `llmstack start`).
; opencode bindings: .llmstack/opencode.json  (written by `llmstack install`).
;
; SUPPORTED TIERS -- canonical names recognised by the router and the
; opencode / llama-swap generators. ONLY the names listed below should
; appear as section headers in this file. Any other section name is
; parsed but ignored by `model: auto` routing and won't be wired into
; the generated opencode.json -- it would just be dead config. To grow
; this set, add the new name here AND update llmstack/app.py +
; llmstack/tiers.py so the router knows about it.
;
;   code-fast        always-resident tiny local coder
;   code-smart       AGENT mode: heavy local coder, tool calls, multi-file edits
;   code-ultra       AGENT mode: top-tier remote coder (Claude Opus via litellm)
;                    - shipped commented-out in the bundled template;
;                      `llmstack install` auto-uncomments it when the
;                      `litellm` extra is installed.
;   plan             PLAN mode: chat-tuned, design discussions
;   plan-uncensored  PLAN mode (no filter): when the topic requires it
;
; Per-tier backends:
;   gguf     local llama-server (managed by llama-swap). Driven by
;            hf_repo + hf_file. This is the default; auto-detected
;            when hf_* keys are present.
;   litellm  remote LLM via litellm library. Identity-only in this file:
;              model              (required; e.g. anthropic/claude-sonnet-4-20250514)
;              model_next         (optional upgrade target)
;            Auto-detected from `model` key; set `backend = litellm`
;            only when you want to override auto-detection.
;
;            CREDENTIALS NEVER LIVE HERE. This file is meant to be
;            committable. Credentials are resolved from environment
;            variables (ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.) or
;            litellm's config file. Configure once with:
;              export ANTHROPIC_API_KEY=sk-ant-...
;            and litellm will pick it up automatically.
; ----------------------------------------------------------------------------

[DEFAULT]
router_host  = 127.0.0.1
router_port  = 10101
n_gpu_layers = 999
flash_attn   = on
threads      = -1
cache_type_k = q8_0
cache_type_v = q8_0

;------------------------------------------------------------------------------
; CODE tier (fast, smart, ultra)
;------------------------------------------------------------------------------

; [code-fast]
; tier         = code
; role         = fast
; hf_repo      = Qwen/Qwen2.5-Coder-3B-Instruct
; hf_file      = Qwen2.5-Coder-3B-Instruct-Q5_K_M.gguf
; ctx_size     = 131072        ; native 128k; YaRN x4 -> 512k, but we cap at 131k
; max_output_tokens = 8192
; size_gb      = 2.5
; quant        = Q5_K_M
; sampler      = temp=0.2     ; deterministic; fast tier for autocomplete / FIM
; description  = Qwen2.5-Coder 3B - always-resident tiny coder for autocomplete / FIM / quick Q&A

; LiteLLM alternative for code-fast -- comment out the [code-fast] block
; above and uncomment the block below to swap to a hosted fast coder
; (Claude Haiku 4.5: cheapest + fastest Anthropic model with tool calling,
; sub-second TTFT). See "LITELLM NOTES" at the bottom of this file.
;
[code-fast]
tier         = code
role         = fast
backend      = litellm
model        = bedrock/eu.anthropic.claude-haiku-4-5-20251001-v1:0
ctx_size     = 200000
max_output_tokens = 8192
sampler      = temp=0.2     ; deterministic; Haiku 4.5 accepts ONE of temp / top_p
description  = Claude Haiku 4.5 via Anthropic API - hosted fast tier for autocomplete / FIM / quick Q&A

; [code-smart]
; tier         = code
; role         = agent
; hf_repo      = unsloth/Qwen3-Coder-Next-GGUF
; hf_file      = Qwen3-Coder-Next-Q4_K_M.gguf
; hf_file_next = Qwen3-Coder-Next-UD-Q4_K_XL.gguf
; ctx_size     = 131072        ; more than mid_fidelity_ceiling -- router steps down to code-fast, but we can go back to smart for longer chats
; max_output_tokens = 32768
; size_gb      = 45
; size_gb_next = 50
; quant        = Q4_K_M
; quant_next   = UD-Q4_K_XL
; sampler      = temp=0.5, top_p=0.85, top_k=20, min_p=0.05, rep_pen=1.05  ; balanced agent
; description  = Qwen3-Coder 30B-A3B MoE - heavy coder for agent loops

; LiteLLM alternative for code-smart -- comment out the [code-smart] block
; above and uncomment the block below to swap to a hosted heavy coder
; (Claude Sonnet 4.6: agent-loop workhorse, heavy tool calling, multi-file
; edits). See "LITELLM NOTES" at the bottom of this file.
;
[code-smart]
tier         = code
role         = agent
backend      = litellm
model        = bedrock/eu.anthropic.claude-sonnet-4-6
ctx_size     = 200000      ; Sonnet 4 native 1M; 200k keeps cost/latency bounded while
                           ; allowing explicit invocation mid-conversation. Auto-routing still
                           ; prefers Sonnet only for inputs <= mid_fidelity_ceiling (18k) --
                           ; ctx_size does not affect that decision.
max_output_tokens = 16384
sampler      = temp=0.5     ; Sonnet 4 accepts ONE of temp / top_p; pick `temp` for agent work
description  = Claude Sonnet 4 via Anthropic API - heavy coder for agent loops

; Top-tier hosted coder. Shipped disabled because it requires litellm +
; API credentials. `llmstack install` auto-uncomments the block
; below (by stripping the leading "; " from each line and dropping
; the BEGIN/END markers) on first seed iff the `litellm` extra is
; installed, i.e. `import litellm` succeeds. On a vanilla install the
; whole block stays inert -- configparser treats `;`-prefixed lines
; as comments, so the section is invisible to the tier loader.
;
[code-ultra]
tier         = code
role         = ultra
backend      = litellm
model        = bedrock/global.anthropic.claude-opus-4-7
ctx_size     = 200000      ; Opus 4 native 1M; 200k is generous without 1M-tier pricing surprises.
                           ; NOTE: ctx_size and the router's high_fidelity_ceiling serve DIFFERENT
                           ; purposes. The ceiling (12k) controls when auto-routing PREFERS this
                           ; tier. ctx_size controls what the tier can HANDLE when explicitly
                           ; invoked (e.g. [opus] trigger mid-conversation). A long chat with an
                           ; [opus] trigger must not fail because ctx_size was set to mirror the
                           ; ceiling -- that breaks valid use cases.
max_output_tokens = 16384    ; cost discipline: Opus is reserved for short, high-value prompts
; NB: no `sampler =` line. Claude Opus 4 explicitly rejects all
;     sampler params (temperature, top_p, top_k) -- per the Anthropic
;     model card, "the recommended migration path is to omit these
;     parameters entirely from your requests". Leaving sampler off
;     makes the router pass requests through untouched.
description  = Claude Opus 4 via Anthropic API - top-tier coder for hard agent tasks

;------------------------------------------------------------------------------
; CHAT tier
;------------------------------------------------------------------------------

; [plan]
; tier         = chat
; role         = plan
; hf_repo      = unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF
; hf_file      = Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
; hf_file_next = Qwen3-30B-A3B-Instruct-2507-Q5_K_M.gguf
; ctx_size     = 131072        ; native 256k; 131k is comfortable headroom
; max_output_tokens = 32768
; size_gb      = 18.6
; size_gb_next = 21.7
; quant        = Q4_K_M
; quant_next   = Q5_K_M
; sampler      = temp=0.7, top_p=0.8, top_k=20, min_p=0.0       ; non-thinking mode default
; description  = Qwen3 30B-A3B - planning, design discussions, architecture (hybrid thinking)

; LiteLLM alternative for plan -- comment out the [plan] block above and
; uncomment the block below to swap to a hosted planner (Claude Opus 4:
; deep reasoning for design discussions and architecture). Opus 4 still
; accepts both temperature and top_p (unlike Opus 4.1), so the local sampler
; maps over cleanly. See "LITELLM NOTES" at the bottom of this file.
;
[plan]
tier         = chat
role         = plan
backend      = litellm
model        = bedrock/eu.anthropic.claude-opus-4-6-v1
ctx_size     = 200000
max_output_tokens = 32768
sampler      = temp=0.7   ; creative; Opus 4
description  = Claude Opus 4 via Anthropic API - planning, design discussions, architecture

; [plan-uncensored]
; tier         = chat
; role         = plan-uncensored
; hf_repo      = mradermacher/Mistral-Small-3.2-24B-Instruct-2506-ultra-uncensored-heretic-i1-GGUF
; hf_file      = Mistral-Small-3.2-24B-Instruct-2506-ultra-uncensored-heretic.i1-Q4_K_M.gguf
; hf_file_next = Mistral-Small-3.2-24B-Instruct-2506-ultra-uncensored-heretic.i1-Q6_K.gguf
; ctx_size     = 131072       ; native 128k support, no YaRN required
; max_output_tokens = 16384
; size_gb      = 13
; size_gb_next = 20
; quant        = i1-Q4_K_M
; quant_next   = i1-Q6_K
; sampler      = temp=0.85, top_p=0.95, top_k=50, min_p=0.05     ; max exploration
; description  = Mistral-Small 3.2 24B Heretic - no-filter planning

; LiteLLM alternative for plan-uncensored -- comment out the [plan-uncensored]
; block above and uncomment the block below. Anthropic models on litellm are
; filtered, so for the uncensored slot we pick the largest open-weights model
; available: Llama 3.1 405B has minimal safety post-training and matches the
; spirit of the local Heretic tier. NOTE: Meta models do NOT require the AWS
; use-case form, so this swap unblocks plan-uncensored on a fresh account
; with any provider supporting Llama 3.1 405B.
;
; [plan-uncensored]
; tier         = chat
; role         = plan-uncensored
; backend      = litellm
; model        = meta/llama-3.1-405b-instruct
; ctx_size     = 128000
; max_output_tokens = 4096
; sampler      = temp=0.85, top_p=0.95   ; max exploration
; description  = Llama 3.1 405B via litellm - no-filter planning

;------------------------------------------------------------------------------
[ROUTING]
; STEP-DOWN ladder: start at the top of the fidelity ladder for short
; conversations, then drop down as context grows. Inverts the classic
; "escalate-on-size" pattern. Rationale:
;
;   * Top-tier remote models (Claude Opus via litellm) are fastest
;     and most accurate on small inputs, but per-request latency and
;     $cost scale with input tokens, and long-context behaviour
;     degrades faster than headline benchmarks suggest.
;   * code-smart (Qwen3-Coder 80B-A3B) has a 256k native window -- best work in
;     the middle of that range, saturates near the top.
;   * code-fast (Qwen2.5-Coder 3B + YaRN x4) has a 128k window, is
;     always-resident (zero load latency), free, and benefits from more
;     explicit context (small models lean on retrieval rather than
;     priors).
;
; First-match-wins decision tree applied by llmstack/app.py when model="auto":
;
;   1. "[ultra]" / "[opus]" / "ultra:" trigger AND code-ultra
;      tier configured                                            -> code-ultra
;   2. tokens <= high_fidelity_ceiling AND code-ultra configured  -> code-ultra
;      tokens <= high_fidelity_ceiling AND no code-ultra          -> code-smart
;   3. tokens <= mid_fidelity_ceiling                             -> code-smart
;   4. otherwise (long context)                                   -> code-fast
;
; Plan and uncensored tiers are accessible via their dedicated agent
; modes (agent.plan, agent.plan-nofilter) and slash commands; they are
; NOT auto-routed through model=auto.
;
; AUTO ROUTER MAX CONTEXT = [code-fast].ctx_size. The fast tier sits at
; the bottom of the step-down ladder, so any context that overflows the
; tiers above lands on fast. Anything beyond fast's window has no safe
; home for model=auto -- callers with such payloads should use an explicit
; model name or [opus]/[ultra] trigger instead of relying on auto-routing.
;
; ROUTING CEILINGS vs CTX-SIZE. These serve DIFFERENT purposes and must
; not be conflated:
;
;   fidelity ceilings  (high_fidelity_ceiling, mid_fidelity_ceiling below)
;     When does auto-routing PREFER a tier? Cost/speed/quality trade-off.
;     A short prompt gets the best model; a long prompt steps down to a
;     cheaper/faster one. These thresholds are the only thing that should
;     reflect cost discipline.
;
;   ctx_size  (per-tier above)
;     What can the tier HANDLE when explicitly invoked? For local GGUF
;     tiers this is VRAM-bounded (set it as high as your hardware allows).
;     For litellm tiers this should be close to the model's native window
;     -- there is no VRAM cost, and a low ctx_size only breaks valid use
;     cases such as an [opus] trigger mid-way through a long conversation.
;
; Example: high_fidelity_ceiling=12000 means auto-routing prefers Opus
; for inputs <= 12k tokens. But if the user types [opus] in an 84k-token
; conversation, the router forces Opus regardless -- and ctx_size must be
; large enough to hold that input or the request will fail/truncate.
;
; The "high-fidelity" rung is gated on availability: when the
; [code-ultra] section is absent (or fails to load), rules (2) and (4)
; silently fall back to code-smart instead of routing to a tier that
; doesn't exist downstream. Override target names with the
; ROUTER_*_MODEL env vars; numeric thresholds with the env vars
; ROUTER_HIGH_FIDELITY_CEILING / ROUTER_MID_FIDELITY_CEILING
;
high_fidelity_ceiling = 20000    ; tokens; below this, top-tier model is still cheap+fast
mid_fidelity_ceiling  = 40000    ; tokens; after the fidelity ceiling, very small window from ultra if enabled
ultra_triggers        = [ultra], [opus], "ultra:", "opus:" (line start)

;------------------------------------------------------------------------------
; LITELLM NOTES  (referenced by the commented-out alternatives above)
;------------------------------------------------------------------------------
; Each tier section above carries a "LiteLLM alternative for <tier>" block
; directly underneath it (commented out by default). To swap a tier:
;
;   1. comment out the active local section (GGUF by default);
;   2. uncomment the litellm-alternative block beneath it;
;   3. run `llmstack install` (and `llmstack restart` if the tier was
;      already loaded -- litellm credentials aren't picked up live).
;
; The router auto-detects backend=litellm from `model`, but every
; alternative block also sets `backend = litellm` explicitly so the intent
; is obvious. llama-swap won't load litellm tiers; the router calls
; litellm directly via the litellm library (`pip install 'opencode-llmstack[litellm]'`).
;
; CREDENTIALS: every alternative uses litellm, which resolves credentials
; from environment variables (ANTHROPIC_API_KEY, OPENAI_API_KEY, GROQ_API_KEY,
; etc.) or litellm's config file. This file ONLY names the model -- never
; put credentials here. One-time setup:
;
;     export ANTHROPIC_API_KEY=sk-ant-...
;     export OPENAI_API_KEY=sk-...
;
; Credentials are resolved by litellm's standard chain (env vars, config
; file, etc.). See https://docs.litellm.ai/docs/ for provider-specific
; setup.
;
; UPGRADE PRE-STAGING: optional `model_next` is the queued upgrade target
; -- mirrors gguf `hf_file_next`. The router uses it only when
; `llmstack start --next` is in effect; permanent promotion is the same
; as gguf: edit `model` and re-run `llmstack install`.
;
; SAMPLER: the `sampler = temp=..., top_p=..., top_k=..., ...` line on
; each tier is the SINGLE SOURCE OF TRUTH for sampling, but how it gets
; applied depends on the backend:
;
;   * gguf tiers -- the llama-swap generator bakes the sampler keys
;     into the llama-server startup command line as `--temp`,
;     `--top-p`, `--top-k`, `--min-p`, `--repeat-penalty` flags.
;     llama-server then uses those as its defaults for every request.
;     The router does NOT touch the request body for gguf tiers --
;     server-side defaults survive across requests cleanly.
;
;   * litellm tiers -- litellm has no server-side defaults mechanism,
;     so the auto-router (llmstack.app) injects the declared sampler
;     keys into each outbound request body. Only the provider-supported
;     subset gets through: `temp` -> `temperature` and `top_p` -> `topP`.
;     `top_k`, `min_p`, `rep_pen` are llama.cpp extensions and are
;     silently dropped by litellm if the provider doesn't support them;
;     declare only what your model accepts. Caller-supplied values in
;     the request body still win, so per-call overrides work.
;
; opencode.json is sampler-free in both cases by design (the
; opencode.json generator never emits sampler params on agents).
;
; Per-provider sampler rules (as of 2026):
;
;   * Claude Opus 4 -- rejects all sampler params; OMIT `sampler =`
;     entirely (the router will then pass requests through untouched).
;   * Claude Sonnet 4 / Haiku 4.5 -- accept `temp` OR `top_p`,
;     never both; pick one.
;   * Claude Opus 3.x -- accept `temp` and `top_p`.
;   * Llama / Groq / Mistral / Cohere / etc. -- accept `temp`
;     + `top_p`; check the model card if in doubt.
;
; ACCESS: Anthropic Claude via litellm requires an API key from
; https://console.anthropic.com/. Other providers have their own
; credential requirements. See https://docs.litellm.ai/docs/providers
; for provider-specific setup.
